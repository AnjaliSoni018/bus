version: '3.9'

services:
  postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-user_service}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - user_net

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - user_net

  user-service:
    build:
      context: ./apps/user-service
      dockerfile: Dockerfile
    restart: on-failure
    env_file:
      - ./apps/user-service/.env
    depends_on:
      - postgres
      - redis
    ports:
      - '3000:3000'
    networks:
      - user_net

volumes:
  postgres_data:
  redis_data:

networks:
  user_net:
    driver: bridge
